<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    @keyframes floatUp {
      0% { transform: translateY(650px) scale(0.5); opacity: 0; }
      15% { opacity: 0.12; }
      85% { opacity: 0.12; }
      100% { transform: translateY(-50px) scale(1.1); opacity: 0; }
    }
    @keyframes popAndFade {
      0%, 100% { transform: scale(0); opacity: 0; }
      20%, 60% { opacity: 0.10; }
      80% { transform: scale(0); opacity: 0; }
    }
    .heart-float { fill: #ff4d6d; transform-origin: center; }
    .heart-pop { fill: #ff4d6d; transform-origin: 12px 12px; }
  </style>

  <!-- ================= FOUNTAIN ON THE LEFT ================= -->
  <path class="heart-float" style="animation: floatUp 10s infinite linear 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(40, 0) scale(0.9)"/>
