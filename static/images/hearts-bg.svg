<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    @keyframes popAndFade {
      0%, 100% { transform: scale(0); opacity: 0; }
      25%, 60% { transform: scale(1); opacity: 0.12; }
      80% { transform: scale(0); opacity: 0; }
    }
    .heart { fill: #ff4d6d; transform-origin: 12px 12px; }
  </style>

  <!-- Grounded hearts popping up and vanishing rhythmically across the canvas grid -->
