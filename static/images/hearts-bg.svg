<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="100%" height="100%">
  <style>
    @keyframes popUpDown {
      0%, 100% { transform: scale(0); opacity: 0; }
      20%, 50% { transform: scale(1); opacity: 0.12; }
      70% { transform: scale(0); opacity: 0; }
    }
    .heart { fill: #ff4d6d; transform-origin: center; animation: popUpDown 6s infinite ease-in-out; }
  </style>
  
