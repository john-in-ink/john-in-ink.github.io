<svg xmlns="http://w3.org" viewBox="0 0 1200 800" width="100%" height="100%">
  <style>
    /* 1. LARGE HEARTS: Fast pulsing fade */
    @keyframes popLarge {
      0%, 100% { transform: scale(0); opacity: 0; }
      20%, 45% { transform: scale(1.8); opacity: 0.14; }
      65% { transform: scale(0); opacity: 0; }
    }
    
    /* 2. MEDIUM HEARTS: Standard gentle fade */
    @keyframes popMedium {
      0%, 100% { transform: scale(0); opacity: 0; }
      25%, 55% { transform: scale(1.1); opacity: 0.10; }
      75% { transform: scale(0); opacity: 0; }
    }

    /* 3. SMALL HEARTS: Rapid twinkling twinkle */
    @keyframes popSmall {
      0%, 100% { transform: scale(0); opacity: 0; }
      30%, 70% { transform: scale(0.6); opacity: 0.08; }
      90% { transform: scale(0); opacity: 0; }
    }

    .h-large { fill: #ff4d6d; transform-origin: 12px 12px; animation: popLarge infinite ease-in-out; }
    .h-medium { fill: #ff4d6d; transform-origin: 12px 12px; animation: popMedium infinite ease-in-out; }
    .h-small { fill: #ff4d6d; transform-origin: 12px 12px; animation: popSmall infinite ease-in-out; }
  </style>

  <!-- ================= GROUP 1: VERY LARGE HEARTS ================= -->
  <g transform="translate(150, 180)"><path class="h-large" style="animation-duration: 7s; animation-delay: 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></g>
