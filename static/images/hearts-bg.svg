<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    /* FOUNTAIN EFFECT: Floating up from bottom to top */
    @keyframes floatUp {
      0% { transform: translateY(650px) scale(0.5); opacity: 0; }
      15% { opacity: 0.12; }
      85% { opacity: 0.12; }
      100% { transform: translateY(-50px) scale(1.1); opacity: 0; }
    }
    
    /* STATIONARY POP EFFECT: Hearts appearing and fading in place */
    @keyframes popAndFade {
      0%, 100% { transform: scale(0); opacity: 0; }
      20%, 60% { transform: scale(1); opacity: 0.10; }
      80% { transform: scale(0); opacity: 0; }
    }

    .heart-float { fill: #ff4d6d; transform-origin: center; }
    .heart-pop { fill: #ff4d6d; transform-origin: 12px 12px; }
  </style>

  <!-- ================= BALANCED FLOATING FOUNTAINS (LEFT & RIGHT) ================= -->
  <!-- Left Side Streams -->
  <path class="heart-float" style="animation: floatUp 10s infinite linear 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(50, 0) scale(0.9)"/>
  <path class="heart-float" style="animation: floatUp 14s infinite linear 3s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(110, 0) scale(0.6)"/>
  
  <!-- Right Side Streams -->
  <path class="heart-float" style="animation: floatUp 12s infinite linear 1.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(690, 0) scale(0.6)"/>
  <path class="heart-float" style="animation: floatUp 15s infinite linear 5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(740, 0) scale(1)"/>

  <!-- ================= SCATTERED POPPING HEARTS (VARIED SIZES & SPEEDS) ================= -->
  <!-- VERY BIG HEARTS -->
  <path class="heart-pop" style="animation: popAndFade 5s infinite ease-in-out 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(200, 120) scale(2.2)"/>
  <path class="heart-pop" style="animation: popAndFade 8s infinite ease-in-out 3.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(580, 250) scale(1.9)"/>

  <!-- MEDIUM HEARTS -->
  <path class="heart-pop" style="animation: popAndFade 9s infinite ease-in-out 2s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(420, 100) scale(1.1)"/>
  <path class="heart-pop" style="animation: popAndFade 6.5s infinite ease-in-out 1s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(280, 410) scale(1.3)"/>

  <!-- SMALL HEARTS -->
  <path class="heart-pop" style="animation: popAndFade 4s infinite ease-in-out 2.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(510, 460) scale(0.6)"/>
  <path class="heart-pop" style="animation: popAndFade 11s infinite ease-in-out 4.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(350, 240) scale(0.5)"/>
</svg>
