<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    /* DYNAMIC FOUNTAIN EFFECT: Floats up while growing, peaking, shrinking, and disappearing */
    @keyframes floatUp {
      0% { 
        transform: translateY(650px) scale(0.3); 
        opacity: 0; 
      }
      30% { 
        transform: translateY(450px) scale(2.0); 
        opacity: 0.14; 
      }
      50% { 
        transform: translateY(300px) scale(4.5); 
        opacity: 0.16; 
      }
      75% { 
        transform: translateY(120px) scale(1.5); 
        opacity: 0.10; 
      }
      100% { 
        transform: translateY(-50px) scale(0.1); 
        opacity: 0; 
      }
    }
    
    /* STATIONARY POP EFFECT: Background canvas heart clusters */
    @keyframes popAndFade {
      0%, 100% { transform: scale(0); opacity: 0; }
      20%, 60% { transform: scale(1); opacity: 0.10; }
      80% { transform: scale(0); opacity: 0; }
    }

    .heart-float { fill: #ff4d6d; transform-origin: center; }
    .heart-pop { fill: #ff4d6d; transform-origin: 12px 12px; }
  </style>

  <!-- ================= LEFT SIDE FOUNTAIN ================= -->
  <path class="heart-float" style="animation: floatUp 11s infinite linear 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(60, 0)"/>
  <path class="heart-float" style="animation: floatUp 14s infinite linear 3.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(110, 0)"/>

  <!-- ================= CENTER FOUNTAIN ================= -->
  <path class="heart-float" style="animation: floatUp 12s infinite linear 1.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(370, 0)"/>
  <path class="heart-float" style="animation: floatUp 15s infinite linear 6s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(420, 0)"/>

  <!-- ================= RIGHT SIDE FOUNTAIN ================= -->
  <path class="heart-float" style="animation: floatUp 13s infinite linear 2s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(670, 0)"/>
  <path class="heart-float" style="animation: floatUp 16s infinite linear 4.5s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(730, 0)"/>

  <!-- ================= AMBIENT BACKGROUND CLUSTERS ================= -->
  <path class="heart-pop" style="animation: popAndFade 8s infinite ease-in-out 0s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(220, 160) scale(1.2)"/>
  <path class="heart-pop" style="animation: popAndFade 10s infinite ease-in-out 3s;" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" transform="translate(560, 360) scale(0.8)"/>
</svg>
