{{ if .IsHome }}
  <title>{{ .Site.Title }}</title>
{{ else }}
  <title>{{ .Title }} - {{ .Site.Title }}</title>
{{ end }}
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  />
  <meta name="theme-color" content="" />
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />
  <link rel="icon" href="{{ `favicon.ico` | relURL }}" type="image/x-icon" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  />
  <link
    rel="stylesheet"
    href="//fonts.googleapis.com/css?family=Didact+Gothic%7CRoboto:400%7CRoboto+Mono"
  />

  {{ \$css := resources.Get "main.css" | css.TailwindCSS }} 
  {{ if hugo.IsProduction }} 
    {{ with \$css | minify | fingerprint }}
    <link
      rel="stylesheet"
      href="{{ .RelPermalink }}"
      integrity="{{ .Data.Integrity | safeHTMLAttr }}"
      crossorigin="anonymous"
    />
    {{ end }} 
  {{ else }}
    <link href="{{ \$css.RelPermalink }}" rel="stylesheet" />
  {{ end }}

  <script>
    const expandAccordion = (elem) => {
      const allPanels = Array.from(document.querySelectorAll(".panel"));
      const allAccordion = Array.from(document.querySelectorAll(".accordion"));

      if (!elem.parentElement.classList.contains("active")) {
        allAccordion.forEach((acc) => {
          acc.classList.remove("active");
        });
        elem.parentElement.classList.add("active");
        allPanels.forEach(function (elem) {
          elem.style.maxHeight = null;
        });
        let activePanel = elem.parentElement.nextElementSibling;
        if (
          activePanel.id != "skill-panel" &&
          document.querySelector("#skill-panel")
        ) {
          let skillBars = Array.from(
            document.querySelectorAll("#skill-percent"),
          );
          skillBars.forEach((elem) => {
            elem.style.width = "0";
          });
        }
        activePanel.style.maxHeight = activePanel.scrollHeight + "px";
      }
    };
  </script>

  <script>
    let html = document.querySelector("html");
    let theme = window.localStorage.getItem("theme");

    const setTheme = (theme) => {
      html.classList.remove("light");
      if (theme === "dark") {
        html.classList.add("dark");
        window.localStorage.setItem("theme", "dark");
      } else {
        html.classList.remove("dark");
        window.localStorage.setItem("theme", "light");
      }
      fixThemeToggleIcon(theme);
    };

    const fixThemeToggleIcon = (theme) => {
      let themeToggle = document.querySelector(".theme-toggle");
      if (themeToggle) {
        if (theme === "dark") {
          themeToggle.classList.remove("bi-moon");
          themeToggle.classList.add("bi-brightness-high");
        } else {
          themeToggle.classList.remove("bi-brightness-high");
          themeToggle.classList.add("bi-moon");
        }
      }
    };

    if (theme == null) {
      if (html.classList.contains("dark")) {
        theme = "dark";
      } else if (html.classList.contains("light")) {
        theme = "light";
      } else {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (prefersDark) {
          theme = "dark";
        } else {
          theme = "light";
        }
      }
    }

    setTheme(theme);

    const toggleTheme = () => {
      html.classList.contains("dark") ? setTheme("light") : setTheme("dark");
    };

    window.onload = () => {
      fixThemeToggleIcon(theme);

      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }

      // INTEGRATED NAV PATCH: Dynamically appends the missing tabs to the menu layout natively
      try {
        const navContainers = document.querySelectorAll('div.flex.flex-row.items-center.gap-4.font-bold, div');
        navContainers.forEach(container => {
          if (container.textContent.trim().startsWith("Home") && container.textContent.includes("Blog") && !container.innerHTML.includes('gallery/')) {
            const galleryLink = document.createElement('a');
            galleryLink.href = '{{ "gallery/" | relURL }}';
            galleryLink.className = 'hover:text-amber-500 transition-colors ml-4';
            galleryLink.textContent = 'Gallery';
            container.appendChild(galleryLink);

            const contactLink = document.createElement('a');
            contactLink.href = '{{ "contact/" | relURL }}';
            contactLink.className = 'hover:text-amber-500 transition-colors ml-4';
            contactLink.textContent = 'Contact';
            container.appendChild(contactLink);
          }
        });
      } catch(e) { console.log(e); }
    };

    window.onresize = () => {
      let defaultActivePanel = document.querySelector(".accordion.active");
      if (defaultActivePanel) {
        defaultActivePanel.nextElementSibling.style.maxHeight =
          defaultActivePanel.nextElementSibling.scrollHeight + "px";
      }
    };
  </script>

  <!-- AUTOMATED DYNAMIC SUBTITLE INJECTION LAYER -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetSubtitle = "Confessions of a hopeless vinyl romantic [18+]";
      
      const injectSubtitles = () => {
        // 1. Full standalone blog post header subtitle setup
        const mainTitle = document.querySelector("main h1, article h1");
        if (mainTitle && mainTitle.textContent.includes("Love Letter to 33")) {
          if (!document.getElementById("post-page-subtitle")) {
            const sub = document.createElement("p");
            sub.id = "post-page-subtitle";
            sub.className = "text-base md:text-lg font-medium tracking-wide text-zinc-400 italic mt-2 mb-4";
            sub.textContent = targetSubtitle;
            mainTitle.insertAdjacentElement("afterend", sub);
          }
        }

        // 2. Accordion inner grid links list subtitle setup
        const links = document.querySelectorAll("a, h3 a, h4 a");
        links.forEach(link => {
          if (link.textContent.includes("Love Letter to 33")) {
            const parentElement = link.closest('div, li, h3, h4');
            if (parentElement && !parentElement.querySelector(".grid-injected-subtitle")) {
              const sub = document.createElement("p");
              sub.className = "grid-injected-subtitle text-sm font-medium tracking-wide text-zinc-400 italic mt-0.5 mb-1";
              sub.textContent = targetSubtitle;
              
              if (parentElement.tagName === 'H3' || parentElement.tagName === 'H4') {
                parentElement.insertAdjacentElement("afterend", sub);
              } else {
                link.insertAdjacentElement("afterend", sub);
              }
            }
          }
        });
      };

      injectSubtitles();

      const observer = new MutationObserver(() => {
        injectSubtitles();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</head>

<style>
  /* Forcefully hides the brightness theme toggles from your header navigation banner */
  .theme-toggle, .bi-brightness-high, .bi-moon {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    width: 0 !important;
    pointer-events: none !important;
  }
</style>

<style>
  /* Force hides the theme toggle button so it can never be clicked */
  .theme-toggle, .bi-brightness-high, .bi-moon {
    display: none !important;
  }
  
  /* Absolute styling override constraint to lock the application dark */
  html, body, main {
    background-color: #1a120b !important;
    color: #f5f5f5 !important;
  }
</style>
