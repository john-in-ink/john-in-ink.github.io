{{ range first 1 (where .Site.RegularPages "Section" "blog") }}
<a href="{{ .Permalink }}" style="display: flex; gap: 1.25rem; text-decoration: none; background: #171717; padding: 1rem; border-radius: 8px; border: 1px solid #262626; transition: background 0.2s; margin-bottom: 1.5rem;" onmouseover="this.style.background='#262626'" onmouseout="this.style.background='#171717'">
    {{ with .Params.image }}
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" style="width: 100px; height: 100px; border-radius: 6px; object-fit: cover;">
    {{ end }}
    <div style="display: flex; flex-direction: column; justify-content: center; text-align: left;">
        <h4 style="color: #ffb703; margin: 0; font-size: 1.1rem; font-weight: 600;">{{ .Title }}</h4>
        <span style="color: #737373; font-size: 0.85rem; margin-top: 0.25rem;">{{ .Date.Format "January 2, 2006" }}</span>
    </div>
</a>
{{ end }}
