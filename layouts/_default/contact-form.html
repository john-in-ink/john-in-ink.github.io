{{ define "main" }}

<!-- Outer Container Centering the Entire Content block -->
<div class="max-w-4xl mx-auto px-4 py-12 flex flex-col items-center justify-center font-mono" style="background-color: #1a120b; color: #f5f5f5; min-h: 75vh; position: relative;">
  
  <!-- Success Popup Message Modal (Hidden by Default) -->
  <div id="thank-you-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 18, 11, 0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: #2a1f15; border: 2px solid #7c2d12; border-radius: 8px; max-width: 400px; width: 100%; padding: 2.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      <div style="font-size: 3rem; margin-bottom: 1rem; animation: dramaticRing 1.5s ease-in-out;">✉️</div>
      <h3 style="font-size: 1.5rem; color: #f5f5f5; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px;">Message Logged</h3>
      <p style="font-size: 0.9rem; color: #a1a1aa; line-height: 1.6; margin-bottom: 2rem;">
        Thanks for your message! It was securely transmitted. We will follow up within 48 hours.
      </p>
      <button onclick="closeSuccessPopup()" style="background: #7c2d12; color: #ffffff; border: none; border-radius: 4px; padding: 0.7rem 2rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.8rem; transition: background 0.3s;">
        Close
      </button>
    </div>
  </div>

  <!-- Outer Wrapper to Restrict and Lock Width to 480px -->
  <div style="width: 100%; max-width: 480px; text-align: left; display: flex; flex-direction: column;">
    
    <!-- Clean Minimalist Left-Aligned Header Box with Active Ringing Phone Emoji -->
    <div style="border-left: 3px solid #7c2d12; padding-left: 1.25rem; margin-bottom: 3.5rem; text-align: left;">
      <p style="font-size: 1.25rem; letter-spacing: -0.5px; color: #d4d4d8; margin: 0 0 0.5rem 0; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 0.6rem;">
        Get in Touch 
        <span class="phone-pulse" style="display: inline-block; font-size: 1.1rem; animation: dramaticRing 1.5s infinite ease-in-out;">✉️</span>
      </p>
      <p style="font-size: 0.9rem; color: #a1a1aa; margin: 0; line-height: 1.6; letter-spacing: -0.1px;">
        Your message is relayed privately. A response will follow within 48 hours.
      </p>
    </div>

    <!-- Routed to your live Google Script Web App Deployment pipeline -->
    <form id="contact-form" action="https://google.com" method="POST" style="display: flex; flex-direction: column; gap: 1.75rem; width: 100%;">

      <!-- Row 01: Identification -->
      <div style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #7c2d12; font-weight: bold;">01. Identification</label>
        <input type="text" name="name" required placeholder="Enter your name..." style="width: 100%; padding: 0.7rem 0.85rem; border: 1px dashed #444; border-radius: 4px; background: #2a1f15; color: #f5f5f5; font-size: 0.9rem; font-family: inherit; outline: none; transition: all 0.25s ease;" onfocus="this.style.borderColor='#7c2d12'; this.style.background='#36271a';" onblur="this.style.borderColor='#444'; this.style.background='#2a1f15';">
      </div>
      
      <!-- Row 02: Return Address -->
      <div style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #7c2d12; font-weight: bold;">02. Return Address</label>
        <input type="email" name="email" required placeholder="Enter your email address..." style="width: 100%; padding: 0.7rem 0.85rem; border: 1px dashed #444; border-radius: 4px; background: #2a1f15; color: #f5f5f5; font-size: 0.9rem; font-family: inherit; outline: none; transition: all 0.25s ease;" onfocus="this.style.borderColor='#7c2d12'; this.style.background='#36271a';" onblur="this.style.borderColor='#444'; this.style.background='#2a1f15';">
      </div>

      <!-- Row 03: Classification -->
      <div style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #7c2d12; font-weight: bold;">03. Classification</label>
        <select name="subject" required style="width: 100%; padding: 0.7rem 0.85rem; border: 1px dashed #444; border-radius: 4px; background: #2a1f15; color: #a1a1aa; font-size: 0.9rem; font-family: inherit; outline: none; cursor: pointer; transition: all 0.25s ease;" onfocus="this.style.borderColor='#7c2d12'; this.style.color='#f5f5f5'; this.style.background='#36271a';" onblur="this.style.borderColor='#444'; this.style.background='#2a1f15';">
          <option value="" disabled selected hidden>Select context topic...</option>
          <option value="General Inquiry">General Inquiry</option>
          <option value="Blog Feedback / Critique">Blog Feedback & Critique</option>
          <option value="Academic Discussion">Academic Discussion</option>
          <option value="Just Saying Hi">Just Saying Hi</option>
        </select>
      </div>
      
      <!-- Row 04: Content Log -->
      <div style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #7c2d12; font-weight: bold;">04. Content Log</label>
        <textarea name="message" rows="5" required placeholder="Write your text message here..." style="width: 100%; padding: 0.7rem 0.85rem; border: 1px dashed #444; border-radius: 4px; background: #2a1f15; color: #f5f5f5; font-size: 0.9rem; font-family: inherit; outline: none; resize: none; line-height: 1.5; transition: all 0.25s ease;" onfocus="this.style.borderColor='#7c2d12'; this.style.background='#36271a';" onblur="this.style.borderColor='#444'; this.style.background='#2a1f15';"></textarea>
      </div>
      
      <!-- Premium Creative Kinetic Action Button Widget -->
      <button type="submit" id="submit-button" class="submit-btn" style="background-color: transparent; color: #7c2d12; border: 1px solid #7c2d12; border-radius: 4px; padding: 0.85rem 2.5rem; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; align-self: flex-start; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden;">
        <span id="submit-text" class="btn-text" style="position: relative; z-index: 2;">Send →</span>
      </button>
    </form>
  </div>

</div>

<!-- Handles AJAX Submission with clear window intercept routines -->
<script>
  document.getElementById("contact-form").addEventListener("submit", function(e) {
    e.preventDefault(); // Prevents Google's 'doGet function not found' screen redirect entirely
    
    const form = this;
    const button = document.getElementById("submit-button");
    const buttonText = document.getElementById("submit-text");
    
    button.disabled = true;
    buttonText.innerText = "Processing...";

    fetch(form.action, {
      method: "POST",
      mode: "no-cors", // Crucial network flag to handle Google spreadsheet inputs cleanly
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(new FormData(form)).toString()
    })
    .then(() => {
      // Fires the inline custom modal popup smoothly on screen
      document.getElementById("thank-you-popup").style.display = "flex";
      form.reset();
    })
    .catch(error => {
      console.error("Submission Error:", error);
      alert("Network transmission error occurred.");
    })
    .finally(() => {
      button.disabled = false;
      buttonText.innerText = "Send →";
    });
  });

  function closeSuccessPopup() {
    document.getElementById("thank-you-popup").style.display = "none";
  }
</script>

<style>
  .submit-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #7c2d12;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1;
  }
  .submit-btn:hover:not(:disabled) {
    color: #ffffff !important;
    letter-spacing: 4px !important;
    border-color: #ff7a45 !important;
    box-shadow: 0 4px 20px rgba(124, 45, 18, 0.25);
  }
  .submit-btn:hover::before {
    transform: scaleX(1);
    transform-origin: left;
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  @keyframes dramaticRing {
    0% { transform: scale(1) rotate(0deg); }
    10% { transform: scale(1.1) rotate(-10deg); }
    20% { transform: scale(1.1) rotate(10deg); }
    30% { transform: scale(1.1) rotate(-10deg); }
    40% { transform: scale(1.1) rotate(10deg); }
    50% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
</style>
{{ end }}
