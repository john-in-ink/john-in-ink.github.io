{{ define "main" }}
<div>
  <!-- Padlet-Style Responsive Grid Container -->
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 36px; width: 100%; margin-top: 1.5rem;">
    
    {{ range .Pages }}
    <!-- Individual Album Card -->
    <div style="display: flex; flex-direction: column; background-color: transparent; border-radius: 12px; overflow: hidden; transition: transform 0.2s ease;" 
         onmouseover="this.style.transform='translateY(-4px)'" 
         onmouseout="this.style.transform='translateY(0)'">
      
      <!-- Card Icon Wrapper Box -->
      <div style="width: 100% !important; max-width: 100% !important; aspect-ratio: 16 / 10 !important; overflow: hidden !important; border-radius: 8px !important; border: 1px solid #3a2a1d !important; margin-bottom: 14px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.4) !important; background-color: #261c14 !important; display: flex !important; justify-content: center !important; align-items: center !important;">
        <a href="{{ .Permalink }}" class="animated-card-link" style="display: block !important; width: 100% !important; height: 100% !important; display: flex !important; justify-content: center !important; align-items: center !important; text-decoration: none !important;">
          
          <!-- MASSIVE TEXT ENGINES: Reverted to full color native emojis with scaled dimensions -->
          <div class="vector-icon-box" style="font-size: 6rem; user-select: none; display: flex; justify-content: center; align-items: center;">
            {{ if eq .Title "Travel" }}✈️{{ end }}
            {{ if eq .Title "Photography" }}📷{{ end }}
            {{ if eq .Title "Paintings" }}🎨{{ end }}
          </div>

        </a>
      </div>

      <!-- Card Text Content Area -->
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 2px 4px; text-align: left;">
        <a href="{{ .Permalink }}" style="text-decoration: none;">
          <h2 style="color: #f59e0b; font-size: 1.45rem; font-weight: 700; margin: 0; line-height: 1.3; transition: color 0.15s ease;" onmouseover="this.style.color='#fbbf24'" onmouseout="this.style.color='#f59e0b'">
            {{- .Title -}}
          </h2>
        </a>
        <div style="font-size: 0.85rem; color: #a3a3a3; font-weight: 500; margin-top: 2px;">
          Click to explore collection
        </div>
      </div>
      
    </div>
    {{ end }}

  </div>
</div>

<!-- NATIVE CSS EFFECT KEYFRAMES: Continuous 3D Spinning Animation -->
<style>
  .vector-icon-box {
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    perspective: 1000px; /* Enables clean 3D depth space rendering */
  }
  
  /* Trigger a continuous cinematic 3D spin on hover */
  .animated-card-link:hover .vector-icon-box {
    animation: iconDramaticSpin 1.5s infinite linear;
  }

  @keyframes iconDramaticSpin {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
  }
</style>
{{ end }}
